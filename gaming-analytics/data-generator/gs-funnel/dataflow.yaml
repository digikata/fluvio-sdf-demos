apiVersion: 0.5.0
meta:
  name: gaming-analytics
  version: 0.1.0
  namespace: examples

config:
  converter: json
  consumer:
    default_starting_offset:
      value: 0
      position: End

types:
  player-activity:
    type: object
    properties:
      event_type:
        type: string
      player_id:
        type: string
      timestamp:
        type: u64
      map:
        type: string
      level:
        type: u32
      success:
        type: bool
      difficulty:
        type: f32

  map-level-prog:
    type: object
    properties:
      map_level:
        type: string
      deaths:
        type: u32
      reached:
        type: u32

  progress-summary:
    type: list
    items:
      type: map-level-prog

topics:
  gs-funnel:
    name: gs-funnel
    schema:
      value:
        type: string
        converter: raw

  progress-summary:
    name: progress-summary
    schema:
      value:
        type: progress-summary

services:
  # generate windowed deaths per level
  gs-progress-summary:
    sources:
      - type: topic
        id: gs-funnel

    states:
      map-level-death-count:
        type: keyed-state
        properties:
          key:
            type: string
          value:
            type: arrow-row
            properties:
              deaths:
                type: u32
              reached:
                type: u32

    transforms:
      - operator: filter-map
        dependencies:
          - name: serde_json
            version: "1.0.60"
        run: |
          fn parse_event(evt_string: String) -> Result<Option<PlayerActivity>> {
            let event = serde_json::from_str(&evt_string);
            Ok(event.ok())
          }

    window:
      tumbling:
        duration: 180s

      assign-timestamp:
        dependencies:
          - name: chrono
            version: "0.4.23"
        # Instruct the engine to apply the timestamp from the event metadata for the watermark operator
        run: |
          fn assign_timestamp(_evt: PlayerActivity, _event_time: i64) -> Result<i64> {
            use chrono::Utc;
            fn now_utc() -> anyhow::Result<i64> {
              let time = Utc::now();
              Ok(time.timestamp_millis())
            }
            now_utc()
          }
          // fn assign_gs_event_timestamp(_value: PlayerActivity, event_time: i64) -> Result<i64> {
          //   Ok(event_time)
          // }

      partition:
        # Assign a partition key to divide the data set for the update operation
        assign-key:
          run: |
            fn assign_gs_event_key(event: PlayerActivity) -> Result<String> {
              let key = match event.event_type.as_str() {
                "player_death" => format!("{}-{}", event.map, event.level),
                "player_progression" => format!("{}-{}", event.map, event.level),
                _ => "other-message".to_string(),
              };
              Ok(key)
            }

        update-state:
          run: |
            fn progress_update_state(event: PlayerActivity) -> Result<()> {
              let mut state = map_level_death_count();
              match event.event_type.as_str() {
                "player_death" => state.deaths += 1,
                "player_progression" => state.reached += 1,
                _ => state.reached += 1,
              };
              state.update()?;
              Ok(())
            }

      flush:
        # Read the full state and compute the top 3 words sorted by count.
        run: |
          fn progress_flush() -> Result<ProgressSummary> {
            let mapdat = map_level_death_count();
            let mut summary = vec![];

            let key = mapdat.key()?;
            let col_deaths = mapdat.col("deaths")?;
            let col_reached = mapdat.col("reached")?;

            let rows = mapdat.rows()?;
            while rows.next() {
              let map_level = rows.str(&key)?;
              let deaths = rows.u32(&col_deaths)?;
              let reached = rows.u32(&col_reached)?;
              summary.push(MapLevelProg {
                map_level,
                deaths,
                reached,
              });
            }
            Ok(summary)
          }

    sinks:
      - type: topic
        id: progress-summary
